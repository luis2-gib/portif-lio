<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luis Gabriel Gomes de Assunção</title>
  <meta name="description" content="Perfil e canais de contato de Luis Gabriel Gomes de Assunção.">
  <meta name="color-scheme" content="dark light">

  <!-- =====================================================================
       CSS: mobile-first. As cores ficam todas nas variáveis de :root,
       então para mudar o visual basta alterar os valores logo abaixo.
       ===================================================================== -->
  <style>
    :root {
      /* Tema escuro (padrão) */
      --fundo: #072B40;
      --faixa: linear-gradient(135deg, #0E7C9B 0%, #1BB6C9 100%);
      --texto: #EAF7FB;
      --texto-suave: #B8D9E6;
      --superficie: #0D3F5C;
      --borda: #2A6A8C;
      --destaque: #5FD3E8;
      --texto-destaque: #03202E;
    }

    /* Tema claro: aplicado automaticamente conforme o aparelho */
    @media (prefers-color-scheme: light) {
      :root {
        --fundo: #F1F9FC;
        --texto: #06283B;
        --texto-suave: #3D6176;
        --superficie: #FFFFFF;
        --borda: #B5D7E5;
        --destaque: #0A6F8E;
        --texto-destaque: #FFFFFF;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--fundo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }

    /* Faixa colorida do topo com borda em onda */
    .topo {
      position: relative;
      height: 150px;
      background: var(--faixa);
    }
    .onda {
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 44px;
      display: block;
    }

    /* Coluna central: conteúdo limitado a 440px, ideal para celular */
    .conteudo {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 0 20px 40px;
      text-align: center;
    }

    /* Foto ou iniciais, sobrepondo a faixa do topo */
    .avatar {
      width: 112px;
      height: 112px;
      margin: -56px auto 16px;
      border-radius: 50%;
      border: 4px solid var(--fundo);
      background: var(--destaque);
      color: var(--texto-destaque);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
      line-height: 1.25;
      font-weight: 800;
    }

    .area {
      margin: 0 0 16px;
      font-size: 1.0625rem;
      font-weight: 600;
      color: var(--destaque);
    }

    .apresentacao {
      margin: 0 auto 28px;
      max-width: 34ch;
      font-size: 1rem;
      color: var(--texto-suave);
    }

    /* Lista de botões */
    .links {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 14px;
    }

    .botao {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 68px;               /* área de toque confortável */
      padding: 12px 18px;
      border-radius: 18px;
      border: 1.5px solid var(--borda);
      background: var(--superficie);
      color: var(--texto);
      text-align: left;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    a.botao:hover { border-color: var(--destaque); transform: translateY(-2px); }
    a.botao:active { transform: translateY(0); }

    /* Foco visível para navegação por teclado */
    a.botao:focus-visible {
      outline: 3px solid var(--destaque);
      outline-offset: 3px;
    }

    /* Botão principal (ex.: WhatsApp) */
    .botao--destaque {
      background: var(--destaque);
      border-color: var(--destaque);
      color: var(--texto-destaque);
    }
    a.botao--destaque:hover { border-color: var(--texto); }

    .icone {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(127, 127, 127, 0.18);
    }
    .icone svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .textos { min-width: 0; flex: 1; }
    .rotulo { display: block; font-size: 1.0625rem; font-weight: 700; line-height: 1.3; }
    .detalhe {
      display: block;
      font-size: 0.9375rem;
      font-weight: 500;
      line-height: 1.35;
      overflow-wrap: anywhere;        /* evita estourar a tela com e-mails longos */
    }
    .botao:not(.botao--destaque) .detalhe { color: var(--texto-suave); }

    .rodape { margin-top: 32px; font-size: 0.875rem; color: var(--texto-suave); }

    /* Respeita quem prefere menos movimento */
    @media (prefers-reduced-motion: reduce) {
      .botao { transition: none; }
      a.botao:hover { transform: none; }
    }

    /* Telas maiores: só um pouco mais de respiro */
    @media (min-width: 600px) {
      .topo { height: 190px; }
      .conteudo { padding-top: 8px; }
    }
  </style>
</head>

<body>
  <!-- =====================================================================
       HTML: estrutura fixa. O conteúdo (nome, textos e botões) é montado
       pelo JavaScript a partir do objeto PERFIL, mais abaixo.
       ===================================================================== -->
  <header class="topo" aria-hidden="true">
    <svg class="onda" viewBox="0 0 440 44" preserveAspectRatio="none" focusable="false">
      <path d="M0,22 C55,2 110,42 220,22 C330,2 385,42 440,22 L440,44 L0,44 Z" fill="var(--fundo)"></path>
    </svg>
  </header>

  <main class="conteudo">
    <div class="avatar" id="avatar"></div>
    <h1 id="nome"></h1>
    <p class="area" id="area"></p>
    <p class="apresentacao" id="apresentacao"></p>

    <ul class="links" id="links"></ul>

    <noscript>
      <p class="apresentacao">Ative o JavaScript do navegador para ver os links.</p>
    </noscript>

    <p class="rodape" id="rodape"></p>
  </main>

  <!-- =====================================================================
       JAVASCRIPT
       ===================================================================== -->
  <script>
    /* ---------------------------------------------------------------------
       EDITE AQUI: é a única parte que você precisa mudar.
       - nome, area, apresentacao: textos do topo da página.
       - foto: caminho ou endereço de uma imagem (ex.: "foto.jpg").
               Deixe "" para mostrar as iniciais do nome.
       - links: um item por botão.
           tipo:      "whatsapp", "instagram", "email" ou "link" (define o ícone)
           rotulo:    título do botão
           detalhe:   texto menor embaixo do título
           url:       endereço completo do botão. Deixe "" para mostrar o botão
                      sem clique (útil enquanto você não tem o link).
           destaque:  true deixa o botão colorido (use em um só).
         Para adicionar um botão, copie uma linha e mude os valores.
         Para remover, apague a linha.
    --------------------------------------------------------------------- */
    const PERFIL = {
      nome: "Luis Gabriel Gomes de Assunção",
      area: "Águas Cuiabá",
      apresentacao: "Boas-vindos(a) ao meu perfil! Aqui você encontra meus principais canais, projetos e formas de falar comigo. Vamos conversar?",
      foto: "",
      links: [
        { tipo: "whatsapp",  rotulo: "WhatsApp",  detalhe: "(65) 99353-1663",   url: "https://wa.me/5565993531663", destaque: true },
        { tipo: "instagram", rotulo: "Instagram", detalhe: "LuisGabriel(Biel)", url: "" },
        { tipo: "email",     rotulo: "E-mail",    detalhe: "gg084178@gmail.com", url: "mailto:gg084178@gmail.com" }
      ]
    };

    /* ---------------------------------------------------------------------
       A partir daqui é o código que monta a página. Não precisa mexer.
    --------------------------------------------------------------------- */

    // Ícones em SVG (traço simples, usam a cor do texto)
    const ICONES = {
      whatsapp:  '<path d="M20 11.5a8 8 0 0 1-11.9 7L4 20l1.5-4A8 8 0 1 1 20 11.5Z"/><path d="M9.2 8.8c.3 2.6 2.6 5 5.3 5.6l1.2-1.3-2-1-.9.7c-.8-.3-1.7-1.200-2-2l.7-.9-1-2-1.300 1.100Z"/>',
      instagram: '<rect x="3.500" y="3.500" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r="0.600"/>',
      email:     '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7.500 8 6 8-6"/>',
      link:      '<path d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1"/><path d="M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1"/>'
    };

    // Iniciais para o avatar quando não houver foto (primeira e última palavra)
    function iniciais(nome) {
      const partes = nome.trim().split(/\s+/);
      const primeira = partes[0] ? partes[0][0] : "";
      const ultima = partes.length > 1 ? partes[partes.length - 1][0] : "";
      return (primeira + ultima).toUpperCase();
    }

    // Cria o ícone de um botão
    function criarIcone(tipo) {
      const caixa = document.createElement("span");
      caixa.className = "icone";
      caixa.setAttribute("aria-hidden", "true");
      caixa.innerHTML = '<svg viewBox="0 0 24 24" focusable="false">' + (ICONES[tipo] || ICONES.link) + "</svg>";
      return caixa;
    }

    // Cria um botão (link ou, sem url, um cartão sem clique)
    function criarBotao(item) {
      const li = document.createElement("li");
      const temUrl = Boolean(item.url && item.url.trim());
      const botao = document.createElement(temUrl ? "a" : "div");
      botao.className = "botao" + (item.destaque ? " botao--destaque" : "");

      if (temUrl) {
        botao.href = item.url;
        // Links da web abrem em nova aba, de forma segura
        if (/^https?:\/\//i.test(item.url)) {
          botao.target = "_blank";
          botao.rel = "noopener noreferrer";
        }
        botao.setAttribute("aria-label", item.rotulo + (item.detalhe ? ": " + item.detalhe : ""));
      }

      const textos = document.createElement("span");
      textos.className = "textos";
      const rotulo = document.createElement("span");
      rotulo.className = "rotulo";
      rotulo.textContent = item.rotulo;
      textos.appendChild(rotulo);
      if (item.detalhe) {
        const detalhe = document.createElement("span");
        detalhe.className = "detalhe";
        detalhe.textContent = item.detalhe;
        textos.appendChild(detalhe);
      }

      botao.appendChild(criarIcone(item.tipo));
      botao.appendChild(textos);
      li.appendChild(botao);
      return li;
    }

    // Monta a página com os dados de PERFIL
    function montarPagina() {
      document.title = PERFIL.nome;
      document.getElementById("nome").textContent = PERFIL.nome;
      document.getElementById("area").textContent = PERFIL.area;
      document.getElementById("apresentacao").textContent = PERFIL.apresentacao;

      const avatar = document.getElementById("avatar");
      if (PERFIL.foto) {
        const img = document.createElement("img");
        img.src = PERFIL.foto;
        img.alt = "Foto de " + PERFIL.nome;
        avatar.appendChild(img);
      } else {
        avatar.textContent = iniciais(PERFIL.nome);
        avatar.setAttribute("aria-hidden", "true");
      }

      const lista = document.getElementById("links");
      PERFIL.links.forEach(function (item) { lista.appendChild(criarBotao(item)); });

      document.getElementById("rodape").textContent = "© " + new Date().getFullYear() + " " + PERFIL.nome;
    }

    montarPagina();
  </script>
</body>
</html>
